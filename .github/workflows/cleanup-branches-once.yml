name: Cleanup merged branches once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branches-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          branches=[
              'docs/canonical-import-doc-001-134',
              'docs/interface-system-and-implementation-status',
          ]
          for branch in branches:
              url=f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}'
              req=urllib.request.Request(url, method='DELETE', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'canonical-docs-cleanup',
              })
              try:
                  with urllib.request.urlopen(req) as r:
                      print(branch, r.status)
              except urllib.error.HTTPError as e:
                  if e.code == 422:
                      print(branch, 'already absent or protected')
                  else:
                      raise
          PY
