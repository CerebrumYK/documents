name: Enterprise documentation audit once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/enterprise-doc-audit-once.yml'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile Enterprise cross-document contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,s): Path(path).write_text(s,encoding='utf-8')
          def repl(path,old,new):
              s=read(path)
              if old in s: write(path,s.replace(old,new))
          def append_once(path,marker,text):
              s=read(path)
              if marker not in s: write(path,s.rstrip()+"\n\n"+text.strip()+"\n")

          repl('docs/domain/domain-model.md',
          'Entities requiring concurrency control SHOULD support logical version/revision indicator.\n\nExact mechanism later:\n\n```text\nversion integer\nupdated_at\netag/hash\n```',
          'Entities requiring concurrency control MUST use a monotonic integer `version` as the authoritative optimistic-concurrency token.\n\nCanonical mechanism:\n\n```text\nversion integer      authoritative compare-and-swap token\nupdated_at           audit/display metadata\netag/hash             MAY be derived for HTTP/cache semantics, never the write authority\n```')

          repl('docs/domain/revisions-and-history.md',
          'Material change after Finalized/Published MUST create:\n\n```text\nnew Grid configuration revision\n```\n\nor new EmotionalGrid derived from prior configuration.\n\nImplementation choice later.\n\n---\n\n# 94. Canonical Recommendation for Grid\n\nUse stable logical EmotionalGrid plus versioned/finalized GridRevision if implementation complexity is acceptable.',
          'Material change after Finalized/Published MUST create a new immutable `GridRevision` under the same stable logical `EmotionalGrid`.\n\nCreating a completely new `EmotionalGrid` is reserved for an intentionally separate grid concept, not ordinary editing of a finalized grid.\n\n---\n\n# 94. Canonical Grid Revision Model\n\nUse stable logical EmotionalGrid plus versioned/finalized immutable GridRevision.')

          repl('docs/database/database-architecture.md',
          '# 33. Enum strategy\n\nPhysical PostgreSQL enum vs text+CHECK is implementation choice.\n\nRecommended preference:\n\n```text\ntext/varchar + CHECK\n```\n\nfor states likely to evolve frequently, unless project ORM/tooling strongly benefits from DB enum.',
          '# 33. Enum strategy\n\nCanonical baseline is:\n\n```text\ntext/varchar + CHECK\n```\n\nfor domain states/enums. This keeps migrations explicit and compatible with the single Drizzle/PostgreSQL stack in DOC-208. Native PostgreSQL ENUM is not the baseline and requires an explicit schema ADR for a specific exceptional type.')

          repl('docs/database/database-architecture.md',
          'Case-insensitive uniqueness for email/slug where appropriate via:\n\n```text\nnormalized column\ncitext\nfunctional lower() index\n```\n\nimplementation choice.',
          'Case-insensitive uniqueness for email/slug uses a canonical normalized application value plus a PostgreSQL functional unique index on `lower(column)` where case-insensitive identity is required.\n\n`citext` is not a baseline dependency. Normalization rules belong to the owning domain/application contract and are covered by migration/integration tests.')

          repl('docs/modules/notifications.md',
          'Notification Center MAY use:\n\n- polling;\n- SSE;\n- websocket;\n- server refresh;\n\nimplementation choice.',
          'Notification Center baseline uses bounded polling/server refresh with backoff and terminal/visibility-aware stop conditions.\n\nSSE/WebSocket are not baseline dependencies and require a future measured-need ADR. Realtime transport never changes notification semantics.')

          repl('docs/operations/deployment.md',
          'Use systemd/container/process manager with:\n\n- restart on failure;\n- graceful stop timeout;\n- environment file permissions;\n- logs integration;\n- correct working directory/user.\n\nExact mechanism documented in server runbook.',
          'Canonical production process packaging is Docker Compose according to DOC-208, with separate `web`, `worker` and `postgres` services and host Nginx as HTTPS reverse proxy.\n\nThe deployment must provide:\n\n- restart on failure;\n- graceful stop timeout;\n- secret/environment permissions;\n- logs/telemetry integration;\n- correct working directory/user;\n- persistent `/data/kate-actor` mounts;\n- one-shot controlled migration execution.\n\nExact compose/service names and commands are recorded in the production runbook after Phase-0 environment audit.')

          append_once('docs/implementation/database-implementation.md','## DOC-208 unified-stack binding','''## DOC-208 unified-stack binding\n\nFor this project, the concrete implementation of the repository/transaction boundary is **Drizzle ORM + node-postgres (`pg`) + one drizzle-kit/reviewed-SQL migration chain**. Raw PostgreSQL SQL remains allowed only inside infrastructure/repository code for explicit features such as partial indexes, FTS/trigram and `SKIP LOCKED`. Prisma/Knex/TypeORM/parallel migration runners are not baseline alternatives. See DOC-208.''')
          append_once('docs/implementation/coding-standards.md','## Canonical toolchain binding','''## Canonical toolchain binding\n\nDOC-208 resolves generic implementation choices: Zod is the runtime schema layer; Pino is the structured logger; OpenTelemetry is the telemetry API/SDK; pnpm is the package manager; ESLint + Prettier are the lint/format baseline; Vitest and Playwright are the canonical automated test frameworks. Equivalent examples in older documents do not authorize a parallel production toolchain.''')
          append_once('docs/testing/testing-strategy.md','## Canonical test tooling','''## Canonical test tooling\n\nThe project test implementation is singular per DOC-208: **Vitest** for unit/integration orchestration, real **PostgreSQL** for database semantics, **Playwright** for E2E/cross-browser/visual, **axe-core** for automated accessibility and **Lighthouse CI** plus controlled browser measurements for public performance. Jest/Cypress/SQLite are not parallel baseline substitutes.''')
          append_once('docs/governance.md','## Implementation technology authority — DOC-208','''## Implementation technology authority — DOC-208\n\nDOC-208 `docs/implementation/unified-technology-stack.md` is authoritative for concrete production implementation technology. Generic alternatives/examples in imported Architecture/Database/API documents remain explanatory and MUST NOT be interpreted as permission to create parallel production stacks. A technology substitution requires an explicit ADR/governance decision plus migration/test/rollback plan.\n\nDOC-225 is the canonical one-campaign Enterprise implementation task. It remains subordinate to Security/privacy and owning Domain semantics while wrapping DOC-206 phases into one continuous execution campaign. DOC-237 is the current consistency-audit authority.''')
          append_once('docs/README.md','## Enterprise implementation entry point','''## Enterprise implementation entry point\n\nFor a full implementation campaign read in this order:\n\n```text\nDOC-003 Governance\n→ DOC-207 Implementation Status\n→ DOC-237 Enterprise Consistency Audit\n→ DOC-233 Final Technical Specification\n→ DOC-208 Unified Technology Stack\n→ DOC-225 Codex Enterprise Implementation Pass\n→ DOC-223 Codex Execution Plan\n→ DOC-206 Sequencing\n→ owning DOC/FR/AC\n```\n\nDOC-225 is the direct Codex task for implementing the entire documented platform as one Enterprise campaign with dependency-safe checkpoints and complete quality evidence.''')
          append_once('docs/final/final-technical-specification.md','## Unified implementation technology authority','''## Unified implementation technology authority\n\nDOC-208 is authoritative for the concrete production toolchain. The high-level architecture in this Technical Specification remains unchanged, but generic alternatives in lower-level imported documents do not permit multiple parallel implementation stacks. DOC-225 is the canonical Enterprise implementation campaign that must realize this specification end-to-end.''')
          append_once('docs/implementation/implementation-sequencing.md','## Enterprise campaign interpretation','''## Enterprise campaign interpretation\n\nDOC-225 wraps all phases in this document into **one continuous Enterprise implementation campaign**. The existing prohibition on a giant “implement everything” PR remains valid: one campaign means no scope abandonment or repeated user prompts between green phases, while phase gates, atomic commits/checkpoints and dependency-safe migrations remain mandatory.''')
          append_once('docs/github/codex-execution-plan.md','## Enterprise campaign wrapper','''## Enterprise campaign wrapper\n\nFor full-platform implementation, DOC-225 is the direct master task and this DOC-223 provides its detailed phase playbook. DOC-208 supplies the concrete technology stack; Codex MUST NOT choose a different ORM/queue/search/storage/styling/test stack merely because an older document contains an “or equivalent” example. The actual repository is still audited first, then legacy technology converges to DOC-208.''')

          repl('docs/github/interface-system-integration.md','Do not assume Next.js/Tailwind/Playwright solely from this documentation; verify application repository reality first.','Verify actual application repository reality first, then reconcile it to DOC-208. Next.js/TypeScript and Playwright are canonical target technologies; CSS Modules/design tokens are the canonical styling baseline. Do not add Tailwind or another parallel UI/test stack merely because the legacy repository differs.')

          append_once('docs/requirements/functional-requirements.md','# Enterprise implementation requirements','''# Enterprise implementation requirements\n\n`FR-ENT-001` The production application converges to the single canonical technology stack in DOC-208.  \n`FR-ENT-002` Runtime/package/container/tool versions are explicitly pinned; no floating production `latest` dependency is allowed.  \n`FR-ENT-003` Competing ORM/migration/queue/search/storage/styling/schema-validation/test stacks are removed or bounded by an explicit temporary migration adapter with removal condition.  \n`FR-ENT-004` All baseline functional domains are implemented through one continuous DOC-225 Enterprise campaign, not left as separately requested future work.  \n`FR-ENT-005` Every release-critical FR maps to actual implementation, migration and passing test evidence before VERIFIED.  \n`FR-ENT-006` Enterprise DONE requires all DOC-179 blocking gates, migration/restore evidence and zero unresolved P0/P1 gaps.  \n`FR-ENT-007` The consuming application integrates the pinned GPT-Skill-Enterfaces workflow without creating a second runtime design system.  \n`FR-ENT-008` Production operations use the canonical Docker Compose + host Nginx topology or an explicitly approved ADR that updates DOC-208.  \n`FR-ENT-009` RPO/RTO are concretized from actual infrastructure and demonstrated by restore rehearsal before Enterprise acceptance.  \n`FR-ENT-010` Machine-readable bidirectional FR/AC→code/migration/test evidence is complete before final release acceptance.''')

          p='docs/requirements/acceptance-criteria.md'; s=read(p)
          if '`AC-MASTER-111`' not in s:
              marker='\n---\n\n## 20. Acceptance state'
              block='''\n# 20. Enterprise integrated implementation\n\n`AC-MASTER-111` Final application uses exactly one canonical production technology stack defined by DOC-208.  \n`AC-MASTER-112` Runtime/package/container versions are pinned and reproducible; production uses no floating `latest`.  \n`AC-MASTER-113` No unauthorized parallel ORM/migration/queue/search/storage/styling/test stack remains at Enterprise acceptance.  \n`AC-MASTER-114` All baseline product modules are implemented within the continuous DOC-225 Enterprise campaign.  \n`AC-MASTER-115` Every release-critical FR has actual code and passing-test traceability.  \n`AC-MASTER-116` Full unit/integration/E2E/security/accessibility/performance/visual/migration/restore gates pass.  \n`AC-MASTER-117` P0/P1 residual implementation gaps are zero at Enterprise DONE.  \n`AC-MASTER-118` Interface implementation is verified through the pinned DOC-156/224 lifecycle and project-owned design evidence.  \n`AC-MASTER-119` Backup/restore rehearsal demonstrates documented achievable RPO/RTO before production acceptance.  \n`AC-MASTER-120` Final Enterprise report identifies exact non-VERIFIED provider/environment limitations; no external success is fabricated.\n'''
              if marker in s:
                  s=s.replace(marker,block+'\n---\n\n## 21. Acceptance state')
                  s=s.replace('## 21. Финальная доктрина','## 22. Финальная доктрина')
                  write(p,s)

          p='docs/requirements/requirements-traceability.md'; s=read(p)
          if '| FR-ENT |' not in s and '| FR-OPS | Operations DOC-190…196 |' in s:
              s=s.replace('| FR-OPS | Operations DOC-190…196 |','| FR-OPS | Operations DOC-190…196 |\n| FR-ENT | DOC-208 Unified Stack + DOC-225 Enterprise Pass + DOC-237 Audit |')
              write(p,s)

          p='docs/implementation/implementation-status.md'; s=read(p)
          s=s.replace('| DOC-200…207 Implementation | Canonical docs present | implementation instructions only |','| DOC-200…208 Implementation | Canonical docs present | implementation instructions only; DOC-208 is concrete stack authority |')
          s=s.replace('| DOC-220…224 GitHub/Codex | Canonical docs present | process/integration requirements only |','| DOC-220…225 GitHub/Codex | Canonical docs present | process/integration requirements only; DOC-225 is Enterprise master task |')
          s=s.replace('| DOC-230…235 Final/Audit | Canonical docs present | status/navigation, not product implementation |','| DOC-230…237 Final/Audit | Canonical docs present | status/navigation/audit, not product implementation |')
          write(p,s)

          p='docs/final/documentation-index.md'; s=read(p)
          s=s.replace('```text\nPRESENT\nPRESENT\nARCHIVED_SOURCE\nNOT_AVAILABLE\n```','```text\nPRESENT\nARCHIVED_SOURCE\nNOT_AVAILABLE\n```')
          if 'DOC-208 docs/implementation/unified-technology-stack.md' not in s: s=s.replace('DOC-207 docs/implementation/implementation-status.md','DOC-207 docs/implementation/implementation-status.md\nDOC-208 docs/implementation/unified-technology-stack.md')
          if 'DOC-225 docs/github/codex-enterprise-implementation-pass.md' not in s: s=s.replace('DOC-224 docs/github/interface-system-integration.md','DOC-224 docs/github/interface-system-integration.md\nDOC-225 docs/github/codex-enterprise-implementation-pass.md')
          if 'DOC-237 docs/final/enterprise-consistency-audit.md' not in s: s=s.replace('DOC-236 docs/final/canonical-import-verification.md','DOC-236 docs/final/canonical-import-verification.md\nDOC-237 docs/final/enterprise-consistency-audit.md')
          s=s.replace('DOC-207 Implementation Status\n→ DOC-233 Final Technical Specification\n→ DOC-235 Current Audit\n→ DOC-223 Codex Execution Plan\n→ DOC-206 Implementation Sequencing','DOC-207 Implementation Status\n→ DOC-237 Enterprise Consistency Audit\n→ DOC-233 Final Technical Specification\n→ DOC-208 Unified Technology Stack\n→ DOC-225 Enterprise Implementation Pass\n→ DOC-223 Codex Execution Plan\n→ DOC-206 Implementation Sequencing')
          write(p,s)
          PY
      - name: Commit reconciliation if needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if git diff --cached --quiet; then
            echo 'No reconciliation changes'
          else
            git commit -m 'docs: reconcile Enterprise stack across canonical contracts'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify structural consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          canonical=[]
          for p in Path('docs').rglob('*.md'):
            sp=str(p)
            if '/archive/' in sp or '/source-materials/' in sp: continue
            canonical.append(p)
          prim=[]
          for p in canonical:
            head='\n'.join(p.read_text(encoding='utf-8',errors='replace').splitlines()[:70])
            m=(re.search(r'\*\*(?:Документ|Document):\*\*\s*DOC-(\d{3})\b',head,re.I) or re.search(r'^##\s+DOC-(\d{3})\b',head,re.M))
            if m: prim.append((int(m.group(1)),str(p)))
          by=collections.defaultdict(list)
          for n,p in prim: by[n].append(p)
          dup={n:v for n,v in by.items() if len(v)>1}
          expected={1,2,3};
          for a,b in [(10,15),(20,30),(40,50),(60,64),(70,80),(90,94),(100,103),(110,134),(140,146),(150,156),(160,165),(170,182),(190,196),(200,208),(220,225),(230,236)]: expected.update(range(a,b+1))
          missing=sorted(expected-set(by))
          broken=[]; linkre=re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for p in canonical+[Path('README.md')]:
            if not p.exists(): continue
            for raw in linkre.findall(p.read_text(encoding='utf-8',errors='replace')):
              target=raw.strip().split('#',1)[0].strip()
              if not target or target.startswith(('http://','https://','mailto:','tel:','#')): continue
              target=target.split(' ',1)[0].strip('<>')
              if not (p.parent/target).resolve().exists(): broken.append((str(p),raw))
          aliases=['database-schema.md','visibility-model.md','validation-rules.md','deletion-retention.md','docs/domain/relationships.md','docs/domain/revisions.md']
          alias_hits=[]
          for p in canonical:
            txt=p.read_text(encoding='utf-8',errors='replace')
            for a in aliases:
              if a in txt: alias_hits.append((str(p),a))
          stale=[]
          for p in [Path('docs/final/documentation-audit.md'),Path('docs/final/gap-analysis.md'),Path('docs/final/final-traceability.md')]:
            txt=p.read_text(encoding='utf-8',errors='replace')
            for term in ['EXPECTED_NOT_IMPORTED','not yet present in this repository','still require import','INCOMPLETE UNTIL EARLIER DOC-001…134']:
              if term.lower() in txt.lower(): stale.append((str(p),term))
          ambiguous=[]
          for p in canonical:
            txt=p.read_text(encoding='utf-8',errors='replace').lower()
            for term in ['implementation choice','exact mechanism later']:
              if term in txt: ambiguous.append((str(p),term))
          print('canonical_md',len(canonical),'primary_ids',len(by),'duplicates',dup,'missing',missing,'broken',len(broken),'aliases',alias_hits,'stale',stale,'ambiguity',ambiguous)
          assert not dup
          assert not missing
          assert not broken
          assert not alias_hits
          assert not stale
          assert not ambiguous
          assert Path('docs/implementation/unified-technology-stack.md').exists()
          assert Path('docs/github/codex-enterprise-implementation-pass.md').exists()
          PY
