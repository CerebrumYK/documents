name: Final documentation wording cleanup once

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/final-doc-wording-fix-once.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          fixes={
            'docs/final/final-traceability.md': [('There is no current `EXPECTED_NOT_IMPORTED` canonical status.','The legacy pre-import repository-status category has been retired; all canonical owner documents are present.')],
            'docs/implementation/coding-standards.md': [('DOC-208 resolves generic implementation choices:','DOC-208 resolves generic technology alternatives:')],
          }
          for fn,rs in fixes.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            for a,b in rs: s=s.replace(a,b)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          git commit -m 'docs: remove final stale audit wording' || exit 0
          git push origin HEAD:${{ github.head_ref }}
