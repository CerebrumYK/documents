name: Cleanup Enterprise audit branch once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-enterprise-audit-branch-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged audit branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          branch='docs/enterprise-stack-audit'
          url=f"https://api.github.com/repos/{os.environ['REPO']}/git/refs/heads/{branch}"
          req=urllib.request.Request(url, method='DELETE', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'enterprise-doc-audit-cleanup',
          })
          try:
              with urllib.request.urlopen(req) as r:
                  print(branch, r.status)
          except urllib.error.HTTPError as e:
              if e.code == 422:
                  print(branch, 'already absent or protected')
              else:
                  raise
          PY
