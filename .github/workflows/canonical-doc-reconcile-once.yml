name: Canonical documentation reconciliation once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/canonical-doc-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize canonical DOC IDs and path aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ids={
            Path('docs/TZ.md'):'DOC-001',
            Path('docs/product/business-rules.md'):'DOC-012',
            Path('docs/product/information-architecture.md'):'DOC-013',
          }
          for p,docid in ids.items():
            s=p.read_text(encoding='utf-8')
            if f'**Документ:** {docid}' not in s and f'**Document:** {docid}' not in s:
              marker='> `✅ Completed` в исходном тексте означает завершённость спецификации, а не реализацию функции.\n'
              if marker in s:
                s=s.replace(marker,marker+f'\n**Документ:** {docid}  \n',1)
              else:
                first=s.find('\n')
                s=s[:first+1]+f'\n**Документ:** {docid}  \n'+s[first+1:]
              p.write_text(s,encoding='utf-8')

          replacements={
            'docs/domain/relationships.md':'docs/domain/entity-relationships.md',
            'docs/domain/revisions.md':'docs/domain/revisions-and-history.md',
            'docs/database/database-schema.md':'docs/database/database-architecture.md',
            'docs/database/visibility-model.md':'docs/database/visibility-and-access.md',
            'docs/database/validation-rules.md':'docs/database/validation-and-constraints.md',
            'docs/database/deletion-retention.md':'docs/database/deletion-and-retention.md',
            'database-schema.md':'database-architecture.md',
            'visibility-model.md':'visibility-and-access.md',
            'validation-rules.md':'validation-and-constraints.md',
            'deletion-retention.md':'deletion-and-retention.md',
          }
          changed=[]
          for p in Path('docs').rglob('*.md'):
            sp=str(p)
            if '/archive/' in sp or '/source-materials/' in sp:
              continue
            s=p.read_text(encoding='utf-8',errors='strict')
            n=s
            for old,new in replacements.items(): n=n.replace(old,new)
            if n!=s:
              p.write_text(n,encoding='utf-8'); changed.append(sp)
          print('changed',len(changed))
          for x in changed: print(x)
          PY
      - name: Commit reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'docs: normalize canonical ids and path references'
            git push origin HEAD:${{ github.head_ref }}
          fi
